name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Allow vendor in deployment
        run: sed -i '/^\\/vendor$/d' .gitignore

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Run migrations
        run: |
          echo "Running migrations..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://totti-legacy.vercel.app/__migrate?secret=${{ secrets.APP_KEY }}&action=migrate")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Output: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Migration failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Run seeders (first deploy only — skips if already seeded)
        run: |
          echo "Running seeders..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://totti-legacy.vercel.app/__migrate?secret=${{ secrets.APP_KEY }}&action=seed")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Output: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Seeder failed with status $HTTP_CODE (continuing anyway)"
          fi