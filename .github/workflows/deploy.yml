name: Post-Deploy Migrations (Render)

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment to complete
        run: |
          echo "Aguardando Render iniciar o deploy..."
          sleep 30

          MAX_WAIT=600
          ELAPSED=0
          INTERVAL=20

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['status'])" \
              2>/dev/null || echo "unknown")

            echo "Status do deploy: $STATUS (${ELAPSED}s)"

            case "$STATUS" in
              live)
                echo "Deploy concluído!"
                break
                ;;
              build_failed|deactivated|canceled)
                echo "Deploy falhou com status: $STATUS"
                exit 1
                ;;
            esac

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Timeout aguardando o deploy (10 minutos)"
            exit 1
          fi

      - name: Run migrations
        run: |
          echo "Rodando migrations..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.RENDER_URL }}/__migrate?secret=${{ secrets.APP_KEY }}&action=migrate")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Output: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Migration falhou com status $HTTP_CODE"
            exit 1
          fi

      - name: Run seeders (first deploy only — skips if already seeded)
        run: |
          echo "Rodando seeders..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.RENDER_URL }}/__migrate?secret=${{ secrets.APP_KEY }}&action=seed")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Output: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Seeder falhou com status $HTTP_CODE (continuando mesmo assim)"
          fi
